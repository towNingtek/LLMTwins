services:
  llmtwins-nantou-gov:
    image: python:3.11-slim
    container_name: llmtwins-nantou-gov
    working_dir: /app

    env_file:
      - .env

    volumes:
      - .:/app

    ports:
      - "7998:7998"

    command: >
      bash -c "
      apt-get update &&
      apt-get install -y tesseract-ocr tesseract-ocr-chi-tra tesseract-ocr-chi-sim tesseract-ocr-eng poppler-utils ghostscript &&
      rm -rf /var/lib/apt/lists/* &&
      pip install --upgrade pip &&
      pip install -r requirements.txt &&
      uvicorn server:app --host 0.0.0.0 --port 7998 --reload
      "

    restart: unless-stopped
