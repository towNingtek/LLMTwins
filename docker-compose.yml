services:
  llmtwins:
    build: .
    image: yillkid/llmtwins:0.1.0
    ports:
      - "8000:8000"
    restart: unless-stopped
    environment:
      # 依你專案需要放環境變數（例）
      OPENAI_API_KEY: "${OPENAI_API_KEY}"
      # 其它自訂變數...
    volumes:
      # 若要持久化這些目錄，就把它們掛出來
      - ./sessions:/app/sessions
      - ./upload:/app/upload

